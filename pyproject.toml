[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-geoportal"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "duckdb==1.5.6",
    "mcp[cli]==2.3.0",
    "rasterio>=1.5.2",
    "uvicorn==0.54.0",
]
# DuckDB verbleibt vorderhand auf 1.5.6. Auf 2.0.0 führt das neue
# Asynchronous I/O in Verbindung mit den Parquet-Files auf geofiles
# zu Verbindungsfehlern. Vermutlich weil zu viele Verbindungen gleich-
# zeitig auf den Server treffen. Wenn die Files auf Google Cloud Storage
# liegen, kommt es nicht zu solchen Fehlern.


[project.scripts]
mcp-geoportal = "mcp_geoportal:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mcp_geoportal.__version__"}

[tool.setuptools.packages.find]
where = ["src/"]

[dependency-groups]
dev = [
    "anyio>=4.11.0",
    "build>=1.6.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
]

